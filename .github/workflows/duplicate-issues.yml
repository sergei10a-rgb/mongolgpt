name: duplicate-issues

on:
  issues:
    types: [opened, edited]

jobs:
  check-duplicates:
    if: github.event.action == 'opened'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      MONGOLGPT_API_KEY: ${{ secrets.MONGOLGPT_API_KEY }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: MongolGPT автомат шалгагчийн тохиргоог шалгах
        id: config
        shell: bash
        run: |
          if [[ -n "$MONGOLGPT_API_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "MONGOLGPT_API_KEY тохируулаагүй тул автомат duplicate шалгалтыг алгаслаа."
          fi

      - name: Автомат шалгалт идэвхгүй байна
        if: steps.config.outputs.enabled != 'true'
        run: echo "MONGOLGPT_API_KEY нэмсний дараа duplicate болон загварын шалгалт автоматаар идэвхжинэ."

      - name: Checkout repository
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-bun
        if: steps.config.outputs.enabled == 'true'

      - name: Install mongolgpt
        if: steps.config.outputs.enabled == 'true'
        run: curl -fsSL https://raw.githubusercontent.com/sergei10a-rgb/mongolgpt/main/install | bash

      - name: Check duplicates and compliance
        if: steps.config.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MONGOLGPT_PERMISSION: |
            {
              "bash": {
                "*": "deny",
                "gh issue*": "allow"
              },
              "webfetch": "deny"
            }
        run: |
          mongolgpt run -m mongolgpt/claude-sonnet-4-6 "A new issue has been created:

          Issue number: ${{ github.event.issue.number }}

          Lookup this issue with gh issue view ${{ github.event.issue.number }}.

          You have TWO tasks. Perform both, then post a SINGLE comment (if needed).

          ---

          TASK 1: CONTRIBUTING GUIDELINES COMPLIANCE CHECK

          Check whether the issue follows our contributing guidelines and issue templates.

          This project has two issue templates that every issue MUST use one of:

          1. Алдаа мэдээлэх - requires an Асуудлын тайлбар field with real content
          2. Шинэ боломж санал болгох - requires a verification checkbox and description, title should start with [САНАЛ]:

          Additionally check:
          - No AI-generated walls of text (long, AI-generated descriptions are not acceptable)
          - The issue has real content, not just template placeholder text left unchanged
          - Bug reports should include some context about how to reproduce
          - Feature requests should explain the problem or need
          - We want to push for having the user provide system description & information

          Do NOT be nitpicky about optional fields. Only flag real problems like: no template used, required fields empty or placeholder text only, obviously AI-generated walls of text, or completely empty/nonsensical content.

          ---

          TASK 2: DUPLICATE CHECK

          Search through existing issues (excluding #${{ github.event.issue.number }}) to find potential duplicates.
          Consider:
          1. Similar titles or descriptions
          2. Same error messages or symptoms
          3. Related functionality or components
          4. Similar feature requests

          Additionally, if the issue mentions keybinds, keyboard shortcuts, or key bindings, reference https://docs.mgpt.mn/docs/keybinds/.

          ---

          POSTING YOUR COMMENT:

          Based on your findings, post a SINGLE comment on issue #${{ github.event.issue.number }}. Build the comment as follows:

          If the issue is NOT compliant, start the comment with:
          <!-- issue-compliance -->
          Then explain what needs to be fixed and that they have 2 hours to edit the issue before it is automatically closed. Also add the label needs:compliance to the issue using: gh issue edit ${{ github.event.issue.number }} --add-label needs:compliance

          If duplicates were found, include a section about potential duplicates with links.

          If the issue mentions keybinds/keyboard shortcuts, include a note about https://docs.mgpt.mn/docs/keybinds/.

          If the issue IS compliant AND no duplicates were found AND no keybind reference, do NOT comment at all.

          Write the whole public comment in Mongolian. Use this format for the comment:

          [If not compliant:]
          <!-- issue-compliance -->
          Энэ issue нь [хувь нэмэр оруулах заавар](../blob/main/CONTRIBUTING.md)-ын шаардлагыг бүрэн хангахгүй байна.

          **Засах шаардлагатай зүйлс:**
          - [тодорхой шалтгаан]

          Дээрхийг засаж issue-гээ **2 цагийн дотор** шинэчилнэ үү. Үгүй бол автоматаар хаагдана.

          [If duplicates found, add:]
          ---
          Энэ issue өмнөх issue-тэй давхардсан байж магадгүй. Дараахыг шалгана уу:
          - #[issue дугаар]: [ижил талын товч тайлбар]

          [If keybind-related, add:]
          Товчлолын асуудал бол [товчлолын баримт бичиг](https://docs.mgpt.mn/docs/keybinds/)-ийг мөн шалгана уу.

          [End with if not compliant:]
          Буруу тэмдэглэгдсэн гэж үзвэл maintainer-д мэдэгдэнэ үү.

          Remember: post at most ONE comment combining all findings. If everything is fine, post nothing."

  recheck-compliance:
    if: github.event.action == 'edited' && contains(github.event.issue.labels.*.name, 'needs:compliance')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      MONGOLGPT_API_KEY: ${{ secrets.MONGOLGPT_API_KEY }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: MongolGPT автомат шалгагчийн тохиргоог шалгах
        id: config
        shell: bash
        run: |
          if [[ -n "$MONGOLGPT_API_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "MONGOLGPT_API_KEY тохируулаагүй тул автомат давтан шалгалтыг алгаслаа."
          fi

      - name: Автомат давтан шалгалт идэвхгүй байна
        if: steps.config.outputs.enabled != 'true'
        run: echo "MONGOLGPT_API_KEY нэмсний дараа засварласан issue-ийн шалгалт автоматаар идэвхжинэ."

      - name: Checkout repository
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-bun
        if: steps.config.outputs.enabled == 'true'

      - name: Install mongolgpt
        if: steps.config.outputs.enabled == 'true'
        run: curl -fsSL https://raw.githubusercontent.com/sergei10a-rgb/mongolgpt/main/install | bash

      - name: Recheck compliance
        if: steps.config.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MONGOLGPT_PERMISSION: |
            {
              "bash": {
                "*": "deny",
                "gh issue*": "allow"
              },
              "webfetch": "deny"
            }
        run: |
          mongolgpt run -m mongolgpt/claude-sonnet-4-6 "Issue #${{ github.event.issue.number }} was previously flagged as non-compliant and has been edited.

          Lookup this issue with gh issue view ${{ github.event.issue.number }}.

          Re-check whether the issue now follows our contributing guidelines and issue templates.

          This project has two issue templates that every issue MUST use one of:

          1. Алдаа мэдээлэх - requires an Асуудлын тайлбар field with real content
          2. Шинэ боломж санал болгох - requires a verification checkbox and description, title should start with [САНАЛ]:

          Additionally check:
          - No AI-generated walls of text (long, AI-generated descriptions are not acceptable)
          - The issue has real content, not just template placeholder text left unchanged
          - Bug reports should include some context about how to reproduce
          - Feature requests should explain the problem or need
          - We want to push for having the user provide system description & information

          Do NOT be nitpicky about optional fields. Only flag real problems like: no template used, required fields empty or placeholder text only, obviously AI-generated walls of text, or completely empty/nonsensical content.

          If the issue is NOW compliant:
          1. Remove the needs:compliance label: gh issue edit ${{ github.event.issue.number }} --remove-label needs:compliance
          2. Find and delete the previous compliance comment (the one containing <!-- issue-compliance -->) using: gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments --jq '.[] | select(.body | contains(\"<!-- issue-compliance -->\")) | .id' then delete it with: gh api -X DELETE repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments/{id}
          3. Issue-гээ шинэчилсэнд нь Монгол хэлээр товч талархсан comment үлдээ.

          If the issue is STILL not compliant:
          Ямар зүйл засах шаардлагатайг Монгол хэлээр тайлбарласан comment үлдээ. needs:compliance label-ийг хэвээр үлдээ."
