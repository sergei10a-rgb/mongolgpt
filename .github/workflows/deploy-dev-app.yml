name: Deploy dev app

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "DEPLOY DEV APP app.dev.mgpt.mn гэж яг бичнэ"
        required: true
        type: string

concurrency:
  group: cloudflare-deploy-dev-app
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MONGOLGPT_RELEASE_SHA: ${{ github.sha }}
  MONGOLGPT_DOMAIN: ${{ vars.MONGOLGPT_DOMAIN }}
  MONGOLGPT_CHANNEL: dev
  MONGOLGPT_ENABLE_HOSTED_SERVICES: "true"
  MONGOLGPT_ENABLE_ADMIN: "false"
  MONGOLGPT_ENABLE_ANALYTICS: "false"
  MONGOLGPT_ENABLE_D1_BACKUPS: "false"
  MONGOLGPT_ENABLE_BUSINESS_INTEGRATIONS: "false"
  MONGOLGPT_ENABLE_LEGACY_STRIPE: "false"
  MONGOLGPT_ENABLE_MONITORING: "false"
  MONGOLGPT_ENABLE_TURNSTILE: "false"
  MONGOLGPT_ENABLE_SHARE_SERVICE: "false"
  MONGOLGPT_ENABLE_SYNC_SERVICE: "false"
  MONGOLGPT_ENABLE_REAL_PAYMENTS: "false"
  MONGOLGPT_PAYMENT_ENVIRONMENT: disabled
  VITE_MONGOLGPT_APP_URL: https://app.dev.mgpt.mn
  VITE_MONGOLGPT_PUBLIC_URL: https://dev.mgpt.mn
  VITE_MONGOLGPT_RELEASE_SHA: ${{ github.sha }}
  VITE_MONGOLGPT_SERVER_URL: https://runtime.dev.mgpt.mn

jobs:
  deploy:
    if: github.repository == 'sergei10a-rgb/mongolgpt' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: dev
    env:
      CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
    steps:
      - name: Validate exact dev app confirmation
        env:
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$DEPLOY_CONFIRMATION" != "DEPLOY DEV APP app.dev.mgpt.mn" ]; then
            echo "Dev app deploy баталгаажуулалт буруу байна."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Verify hosted app artifact
        run: |
          bun run --cwd packages/app typecheck
          bun run --cwd packages/app test:unit
          bun --cwd packages/app test ./e2e/deployed/network.test.ts
          bun run --cwd packages/script test
          bun run --cwd packages/app build:hosted

      - name: Deploy only dev app to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MONGOLGPT_DEPLOY_APP_ONLY: "true"
        run: |
          bun run deploy:preflight -- dev --app-only
          bun sst unlock --stage=dev || true
          bun sst deploy --stage=dev --target WebApp --print-logs

      - name: Verify live dev app boundary
        env:
          MONGOLGPT_DEPLOY_APP_ONLY: "true"
        run: bun script/deployment-smoke.ts --app-only dev
