name: Баримт бичиг шинэчлэх

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LOOKBACK_HOURS: 4
  MONGOLGPT_CLI_VERSION: 0.1.2

jobs:
  update-docs:
    if: github.repository == 'sergei10a-rgb/mongolgpt'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - name: Эх кодыг татах
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # Коммитын бүрэн түүхийг ашиглана

      - name: Bun тохируулах
        uses: ./.github/actions/setup-bun

      - name: Сүүлийн коммитуудыг авах
        id: commits
        run: |
          COMMITS=$(git log --since="${{ env.LOOKBACK_HOURS }} hours ago" --pretty=format:"- %h %s" 2>/dev/null || echo "")
          if [ -z "$COMMITS" ]; then
            echo "Сүүлийн ${{ env.LOOKBACK_HOURS }} цагт шинэ коммит алга"
            echo "has_commits=false" >> $GITHUB_OUTPUT
          else
            echo "has_commits=true" >> $GITHUB_OUTPUT
            {
              echo "list<<EOF"
              echo "$COMMITS"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          fi

      - name: Автомат шинэчлэл бэлэн эсэхийг шалгах
        id: readiness
        if: steps.commits.outputs.has_commits == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MONGOLGPT_API_KEY: ${{ secrets.MONGOLGPT_API_KEY }}
        run: |
          echo "ready=false" >> "$GITHUB_OUTPUT"
          if [ -z "${MONGOLGPT_API_KEY:-}" ]; then
            echo "MONGOLGPT_API_KEY тохируулаагүй тул баримт бичгийн автомат шинэчлэлийг алгаслаа."
            exit 0
          fi

          target="linux-x64"
          if ! grep -qwi avx2 /proc/cpuinfo 2>/dev/null; then
            target="linux-x64-baseline"
          fi
          asset="mongolgpt-${target}.tar.gz"
          tag="mongolgpt-v${MONGOLGPT_CLI_VERSION}"
          if ! release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" 2>/dev/null); then
            echo "${tag} албан ёсны хувилбар гараагүй тул баримт бичгийн автомат шинэчлэлийг алгаслаа."
            exit 0
          fi
          if ! jq -e --arg asset "$asset" 'any(.assets[]?; .name == $asset)' <<<"$release" >/dev/null; then
            echo "${tag} хувилбарт ${asset} файл байхгүй тул баримт бичгийн автомат шинэчлэлийг алгаслаа."
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: MongolGPT ажиллуулах
        if: steps.commits.outputs.has_commits == 'true' && steps.readiness.outputs.ready == 'true'
        uses: ./github
        env:
          MONGOLGPT_API_KEY: ${{ secrets.MONGOLGPT_API_KEY }}
        with:
          cli_version: ${{ env.MONGOLGPT_CLI_VERSION }}
          model: mongolgpt/gpt-5.2
          agent: docs
          prompt: |
            Сүүлийн ${{ env.LOOKBACK_HOURS }} цагийн дараах коммитуудыг шалгаж, баримт бичигт нэмэх шаардлагатай шинэ боломж байгаа эсэхийг тогтоо.

            <recent_commits>
            ${{ steps.commits.outputs.list }}
            </recent_commits>

            Алхмууд:
            1. Шинэ боломж эсвэл томоохон өөрчлөлттэй төстэй коммит бүрийн хувьд:
               - Нэмэгдсэн зүйлийг ойлгохын тулд өөрчлөгдсөн файлуудыг унш
               - Тухайн боломж packages/web/src/content/docs/* дотор аль хэдийн баримтжуулсан эсэхийг шалга
            2. Баримтжуулаагүй боломж олдвол:
               - packages/web/src/content/docs/* доторх холбогдох баримт бичгийг шинэчил
               - Одоогийн Монгол баримт бичгийн хэлбэр, бүтцийг дага
               - Тохирох үед ойлгомжтой жишээ оруул
            3. Бүх шинэ боломж баримтжуулсан бол өөрчлөлт шаардлагагүйг тайлагна
            4. Шинэ баримт бичгийн файл үүсгэвэл packages/web/astro.config.mjs-ийг мөн шинэчил.

            Хэрэглэгчид харагдах боломж болон API өөрчлөлтөд төвлөр. Хэрэглэгчийн үйлдэлд нөлөөлөхгүй дотоод шинэчлэл, алдаа засвар, тестийн өөрчлөлтийг алгас.
            Жижиг өөрчлөлт бүрийг баримтжуулах шаардлагагүй бөгөөд огт өөрчлөлт хийхгүй байх нь зөв байж болно.
            Зөвхөн томоохон боломж эсвэл одоогийн баримт бичигт тодорхой байртай өөрчлөлтийг нэм.
