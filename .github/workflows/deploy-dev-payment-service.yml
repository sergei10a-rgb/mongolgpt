name: Update disabled dev payment service

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type UPDATE DISABLED DEV PAYMENTS"
        required: true
        type: string

concurrency:
  group: cloudflare-deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PULUMI_TF_BRIDGE_ACCURATE_PF_BRIDGE_PREVIEW: "true"
  MONGOLGPT_DOMAIN: ${{ vars.MONGOLGPT_DOMAIN }}
  MONGOLGPT_ENABLE_HOSTED_SERVICES: "true"
  MONGOLGPT_DEPLOY_CONSOLE_ONLY: "true"
  MONGOLGPT_ENABLE_ROOT_PREVIEW_ALIAS: "false"
  MONGOLGPT_ENABLE_ADMIN: "false"
  MONGOLGPT_ENABLE_ANALYTICS: "false"
  MONGOLGPT_ENABLE_D1_BACKUPS: "false"
  MONGOLGPT_ENABLE_BUSINESS_INTEGRATIONS: "false"
  MONGOLGPT_ENABLE_LEGACY_STRIPE: "false"
  MONGOLGPT_ENABLE_MONITORING: "false"
  MONGOLGPT_ENABLE_TURNSTILE: "true"
  MONGOLGPT_ENABLE_SHARE_SERVICE: "false"
  MONGOLGPT_ENABLE_SYNC_SERVICE: "false"
  MONGOLGPT_ENABLE_REAL_PAYMENTS: "false"
  MONGOLGPT_PAYMENT_ENVIRONMENT: disabled
  MONGOLGPT_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"

jobs:
  deploy:
    if: github.repository == 'sergei10a-rgb/mongolgpt' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: dev
    steps:
      - name: Validate disabled dev confirmation
        env:
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$DEPLOY_CONFIRMATION" != "UPDATE DISABLED DEV PAYMENTS" ]; then
            echo "Disabled dev payment confirmation does not match."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Verify payment boundaries and disabled health contract
        run: |
          bun test --cwd packages/script test/payment-service-deployment-guard.test.ts test/payment-service-live-check.test.ts test/payment-service-deployment-workflow.test.ts test/payment-service-pulumi-args.test.ts test/payment-service-pulumi-launcher.test.ts test/payment-service-failure-report.test.ts test/usage-queue-deployment-guard.test.ts
          bun test --cwd packages/console/function test/payment-webhook.test.ts test/service-monitor.test.ts

      - name: Guard and update only the disabled dev payment worker
        env:
          CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MONGOLGPT_AUTH_EMAIL_DOMAINS: ${{ vars.MONGOLGPT_AUTH_EMAIL_DOMAINS }}
          MONGOLGPT_RUNTIME_AUTH_SECRET: ${{ secrets.MONGOLGPT_RUNTIME_AUTH_SECRET }}
          SST_SECRET_ByokCredentialsKeyV1: ${{ secrets.BYOK_CREDENTIALS_KEY_V1 }}
          SST_SECRET_D1BackupApiToken: "disabled"
          SST_SECRET_GITHUB_CLIENT_ID_CONSOLE: ${{ vars.MONGOLGPT_GITHUB_OAUTH_CLIENT_ID }}
          SST_SECRET_GITHUB_CLIENT_SECRET_CONSOLE: ${{ secrets.MONGOLGPT_GITHUB_OAUTH_CLIENT_SECRET }}
          SST_SECRET_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          SST_SECRET_MONGOLGPT_PLAN_LIMITS: ${{ secrets.MONGOLGPT_PLAN_LIMITS }}
          SST_SECRET_MongolGPTRuntimeAuthSecret: ${{ secrets.MONGOLGPT_RUNTIME_AUTH_SECRET }}
          SST_SECRET_TurnstileSecretKey: "1x0000000000000000000000000000000AA"
          SST_SECRET_MONGOLGPT_GATEWAY_SESSION_SECRET: ${{ secrets.MONGOLGPT_GATEWAY_SESSION_SECRET }}
        run: |
          set -euo pipefail
          if [ "$CLOUDFLARE_ACCOUNT_ID" != "cc97ad90bfaf8a1da5de612eef2658f5" ] || [ "$MONGOLGPT_DOMAIN" != "mgpt.mn" ]; then
            echo "Unexpected Cloudflare dev account or domain."
            exit 1
          fi
          bun script/check-dev-payment-service.ts before
          umask 077
          diff_file="$(mktemp "$RUNNER_TEMP/mongolgpt-payment-diff.XXXXXX")"
          stdout_file="$(mktemp "$RUNNER_TEMP/mongolgpt-payment-output.XXXXXX")"
          stderr_file="$(mktemp "$RUNNER_TEMP/mongolgpt-payment-stderr.XXXXXX")"
          adapter_file="$(mktemp "$RUNNER_TEMP/mongolgpt-payment-pulumi.XXXXXX")"
          diagnostic_file="$(mktemp "$RUNNER_TEMP/mongolgpt-payment-diagnostic.XXXXXX")"
          trap 'rm -f "$diff_file" "$stdout_file" "$stderr_file" "$adapter_file" "$diagnostic_file"' EXIT
          if ! bun build script/pulumi-dev-payment.ts --compile --outfile "$adapter_file" >"$stderr_file" 2>&1; then
            echo "Scoped dev payment launcher build failed."
            exit 1
          fi
          export SST_PULUMI_PATH="$adapter_file"
          export MONGOLGPT_PAYMENT_DIAGNOSTIC_FILE="$diagnostic_file"
          if ! bun sst diff --stage=dev --target PaymentServiceScript --target PaymentServiceUrl.sst.cloudflare.WorkerUrl --json --print-logs >"$diff_file" 2>"$stderr_file"; then
            echo "Disabled dev payment preview failed; private output was not printed."
            bun script/report-dev-payment-failure.ts "$diagnostic_file" "$diff_file" "$stderr_file"
            exit 1
          fi
          bun script/verify-payment-service-deployment.ts "$diff_file"
          : >"$diagnostic_file"
          if ! bun sst deploy --stage=dev --target PaymentServiceScript --target PaymentServiceUrl.sst.cloudflare.WorkerUrl --print-logs >"$stdout_file" 2>"$stderr_file"; then
            echo "Disabled dev payment deployment failed; inspect current state before retrying. Private output was not printed."
            bun script/report-dev-payment-failure.ts "$diagnostic_file" "$stdout_file" "$stderr_file"
            exit 1
          fi
          bun script/check-dev-payment-service.ts after
