name: Deploy dev console

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "DEPLOY DEV CONSOLE dev.mgpt.mn гэж яг бичнэ"
        required: true
        type: string
      root_preview_alias:
        description: "mgpt.mn болон www.mgpt.mn-ийг dev console preview alias болгох"
        required: false
        default: true
        type: boolean

concurrency:
  group: cloudflare-deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MONGOLGPT_RELEASE_SHA: ${{ github.sha }}
  MONGOLGPT_DOMAIN: ${{ vars.MONGOLGPT_DOMAIN }}
  MONGOLGPT_ENABLE_HOSTED_SERVICES: "true"
  MONGOLGPT_DEPLOY_CONSOLE_ONLY: "true"
  MONGOLGPT_ENABLE_ROOT_PREVIEW_ALIAS: ${{ inputs.root_preview_alias }}
  MONGOLGPT_ENABLE_ADMIN: "false"
  MONGOLGPT_ENABLE_ANALYTICS: "false"
  MONGOLGPT_ENABLE_D1_BACKUPS: "false"
  MONGOLGPT_ENABLE_BUSINESS_INTEGRATIONS: "false"
  MONGOLGPT_ENABLE_LEGACY_STRIPE: "false"
  MONGOLGPT_ENABLE_MONITORING: "false"
  MONGOLGPT_ENABLE_TURNSTILE: "true"
  MONGOLGPT_ENABLE_SHARE_SERVICE: "false"
  MONGOLGPT_ENABLE_SYNC_SERVICE: "false"
  MONGOLGPT_ENABLE_REAL_PAYMENTS: "false"
  MONGOLGPT_PAYMENT_ENVIRONMENT: disabled
  MONGOLGPT_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"

jobs:
  deploy:
    if: github.repository == 'sergei10a-rgb/mongolgpt' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: dev
    env:
      CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
    steps:
      - name: Validate exact dev console confirmation
        env:
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$DEPLOY_CONFIRMATION" != "DEPLOY DEV CONSOLE dev.mgpt.mn" ]; then
            echo "Dev console deploy баталгаажуулалт буруу байна."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Verify public console and OAuth artifacts
        run: |
          bun test --cwd packages/console/core
          bun test --cwd packages/console/function
          bun run --cwd packages/console/app typecheck
          bun test --cwd packages/console/app

      - name: Verify Cloudflare console token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun script/cloudflare-preflight.ts --console-only

      - name: Prepare dev Free Auto catalog without logging provider keys
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          NVIDIA_NIM_MODEL_ID: ${{ vars.NVIDIA_NIM_MODEL_ID }}
          MONGOLGPT_GATEWAY_MODELS1: ${{ secrets.MONGOLGPT_GATEWAY_MODELS1 }}
          MONGOLGPT_GATEWAY_MODELS2: ${{ secrets.MONGOLGPT_GATEWAY_MODELS2 }}
          MONGOLGPT_GATEWAY_MODELS3: ${{ secrets.MONGOLGPT_GATEWAY_MODELS3 }}
          MONGOLGPT_GATEWAY_MODELS4: ${{ secrets.MONGOLGPT_GATEWAY_MODELS4 }}
          MONGOLGPT_GATEWAY_MODELS5: ${{ secrets.MONGOLGPT_GATEWAY_MODELS5 }}
          MONGOLGPT_GATEWAY_MODELS6: ${{ secrets.MONGOLGPT_GATEWAY_MODELS6 }}
          MONGOLGPT_GATEWAY_MODELS7: ${{ secrets.MONGOLGPT_GATEWAY_MODELS7 }}
          MONGOLGPT_GATEWAY_MODELS8: ${{ secrets.MONGOLGPT_GATEWAY_MODELS8 }}
          MONGOLGPT_GATEWAY_MODELS9: ${{ secrets.MONGOLGPT_GATEWAY_MODELS9 }}
          MONGOLGPT_GATEWAY_MODELS10: ${{ secrets.MONGOLGPT_GATEWAY_MODELS10 }}
          MONGOLGPT_GATEWAY_MODELS11: ${{ secrets.MONGOLGPT_GATEWAY_MODELS11 }}
          MONGOLGPT_GATEWAY_MODELS12: ${{ secrets.MONGOLGPT_GATEWAY_MODELS12 }}
          MONGOLGPT_GATEWAY_MODELS13: ${{ secrets.MONGOLGPT_GATEWAY_MODELS13 }}
          MONGOLGPT_GATEWAY_MODELS14: ${{ secrets.MONGOLGPT_GATEWAY_MODELS14 }}
          MONGOLGPT_GATEWAY_MODELS15: ${{ secrets.MONGOLGPT_GATEWAY_MODELS15 }}
          MONGOLGPT_GATEWAY_MODELS16: ${{ secrets.MONGOLGPT_GATEWAY_MODELS16 }}
          MONGOLGPT_GATEWAY_MODELS17: ${{ secrets.MONGOLGPT_GATEWAY_MODELS17 }}
          MONGOLGPT_GATEWAY_MODELS18: ${{ secrets.MONGOLGPT_GATEWAY_MODELS18 }}
          MONGOLGPT_GATEWAY_MODELS19: ${{ secrets.MONGOLGPT_GATEWAY_MODELS19 }}
          MONGOLGPT_GATEWAY_MODELS20: ${{ secrets.MONGOLGPT_GATEWAY_MODELS20 }}
          MONGOLGPT_GATEWAY_MODELS21: ${{ secrets.MONGOLGPT_GATEWAY_MODELS21 }}
          MONGOLGPT_GATEWAY_MODELS22: ${{ secrets.MONGOLGPT_GATEWAY_MODELS22 }}
          MONGOLGPT_GATEWAY_MODELS23: ${{ secrets.MONGOLGPT_GATEWAY_MODELS23 }}
          MONGOLGPT_GATEWAY_MODELS24: ${{ secrets.MONGOLGPT_GATEWAY_MODELS24 }}
          MONGOLGPT_GATEWAY_MODELS25: ${{ secrets.MONGOLGPT_GATEWAY_MODELS25 }}
          MONGOLGPT_GATEWAY_MODELS26: ${{ secrets.MONGOLGPT_GATEWAY_MODELS26 }}
          MONGOLGPT_GATEWAY_MODELS27: ${{ secrets.MONGOLGPT_GATEWAY_MODELS27 }}
          MONGOLGPT_GATEWAY_MODELS28: ${{ secrets.MONGOLGPT_GATEWAY_MODELS28 }}
          MONGOLGPT_GATEWAY_MODELS29: ${{ secrets.MONGOLGPT_GATEWAY_MODELS29 }}
          MONGOLGPT_GATEWAY_MODELS30: ${{ secrets.MONGOLGPT_GATEWAY_MODELS30 }}
        run: bun script/prepare-dev-free-auto.ts

      - name: Deploy only dev OAuth and public console to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MONGOLGPT_RUNTIME_AUTH_SECRET: ${{ secrets.MONGOLGPT_RUNTIME_AUTH_SECRET }}
          MONGOLGPT_AUTH_EMAIL_DOMAINS: ${{ vars.MONGOLGPT_AUTH_EMAIL_DOMAINS }}
          SST_SECRET_ByokCredentialsKeyV1: ${{ secrets.BYOK_CREDENTIALS_KEY_V1 }}
          SST_SECRET_D1BackupApiToken: "disabled"
          SST_SECRET_GITHUB_CLIENT_ID_CONSOLE: ${{ vars.MONGOLGPT_GITHUB_OAUTH_CLIENT_ID }}
          SST_SECRET_GITHUB_CLIENT_SECRET_CONSOLE: ${{ secrets.MONGOLGPT_GITHUB_OAUTH_CLIENT_SECRET }}
          SST_SECRET_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          SST_SECRET_MONGOLGPT_PLAN_LIMITS: ${{ secrets.MONGOLGPT_PLAN_LIMITS }}
          SST_SECRET_MongolGPTRuntimeAuthSecret: ${{ secrets.MONGOLGPT_RUNTIME_AUTH_SECRET }}
          SST_SECRET_TurnstileSecretKey: "1x0000000000000000000000000000000AA"
          SST_SECRET_MONGOLGPT_GATEWAY_SESSION_SECRET: ${{ secrets.MONGOLGPT_GATEWAY_SESSION_SECRET }}
        run: |
          bun run deploy:preflight -- dev --console-only
          bun sst unlock --stage=dev || true
          set -o pipefail
          if ! database_id="$(bun sst state export --stage=dev | bun script/resolve-sst-d1-state.ts)"; then
            echo "Dev SST state-д Database алга. Эхлээд үндсэн Cloudflare deploy workflow ажиллуулах шаардлагатай."
            exit 1
          fi
          MONGOLGPT_DATABASE_ID="$database_id" bun run db:migrate
          unset database_id
          bun sst deploy --stage=dev --target Console --print-logs
          # AuthApi target traverses its Console dependent, which requires the SolidStart output above.
          bun sst deploy --stage=dev --target AuthApi --print-logs
          # Publish Console last so its linked auth URL and build environment are authoritative.
          bun sst deploy --stage=dev --target Console --print-logs

      - name: Verify live dev OAuth and public console boundaries
        env:
          MONGOLGPT_AUTH_EMAIL_DOMAINS: ${{ vars.MONGOLGPT_AUTH_EMAIL_DOMAINS }}
        run: |
          MONGOLGPT_DEPLOY_CONSOLE_ONLY=false bun script/deployment-smoke.ts --auth-bootstrap dev
          bun script/deployment-smoke.ts --console-only dev
