name: Cloudflare deploy

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Deploy хийх орчин"
        required: true
        type: choice
        default: dev
        options:
          - dev
          - production
      admin:
        description: "Cloudflare Access MFA хамгаалалттай admin.mgpt.mn-ийг асаах"
        required: true
        type: boolean
        default: false
      analytics:
        description: "Hosted deploy дээр Cloudflare D1 live stats-г асаах"
        required: true
        type: boolean
        default: false
      payment_environment:
        description: "Bonum + QPay төлбөрийн орчин"
        required: true
        type: choice
        default: disabled
        options:
          - disabled
          - sandbox
          - production
      production_confirmation:
        description: "Production бол DEPLOY <domain> гэж яг бичнэ"
        required: false
        type: string
      real_payment_confirmation:
        description: "Бодит төлбөр бол ENABLE REAL PAYMENTS <domain> гэж яг бичнэ"
        required: false
        type: string

concurrency:
  group: cloudflare-deploy-${{ inputs.stage }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MONGOLGPT_DOMAIN: ${{ vars.MONGOLGPT_DOMAIN }}
  MONGOLGPT_ENABLE_HOSTED_SERVICES: "true"
  MONGOLGPT_ENABLE_ADMIN: ${{ inputs.admin }}
  MONGOLGPT_ENABLE_ANALYTICS: ${{ inputs.analytics }}
  MONGOLGPT_ENABLE_D1_BACKUPS: ${{ inputs.stage == 'production' && 'true' || 'false' }}
  MONGOLGPT_ENABLE_BUSINESS_INTEGRATIONS: "false"
  MONGOLGPT_ENABLE_LEGACY_STRIPE: "false"
  MONGOLGPT_ENABLE_MONITORING: "true"
  MONGOLGPT_ENABLE_TURNSTILE: "true"
  MONGOLGPT_TURNSTILE_SITE_KEY: ${{ inputs.stage == 'production' && vars.MONGOLGPT_TURNSTILE_SITE_KEY || '1x00000000000000000000AA' }}
  MONGOLGPT_ENABLE_SHARE_SERVICE: "false"
  MONGOLGPT_ENABLE_SYNC_SERVICE: "false"
  MONGOLGPT_PRODUCTION_CONFIRMATION: ${{ inputs.production_confirmation }}
  MONGOLGPT_PAYMENT_ENVIRONMENT: ${{ inputs.payment_environment }}
  MONGOLGPT_PAYMENT_PLAN_CATALOG: ${{ vars.MONGOLGPT_PAYMENT_PLAN_CATALOG }}
  MONGOLGPT_ENABLE_REAL_PAYMENTS: ${{ inputs.payment_environment == 'production' && 'true' || 'false' }}
  MONGOLGPT_REAL_PAYMENT_CONFIRMATION: ${{ inputs.real_payment_confirmation }}

jobs:
  verify:
    if: github.repository == 'sergei10a-rgb/mongolgpt' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Typecheck
        run: bun typecheck

      - name: Test deployment contracts
        run: |
          bun run --cwd packages/script test
          bun run --cwd packages/console/admin test
          bun run --cwd packages/console/core test
          bun run --cwd packages/runtime-auth test
          bun run --cwd packages/runtime test

      - name: Verify hosted authentication
        working-directory: packages/console/app
        run: |
          bun test
          bun run typecheck

      - name: Verify admin application
        run: |
          bun run --cwd packages/console/admin typecheck
          bun run --cwd packages/console/admin build

      - name: Build docs
        run: bun run build:docs

      - name: Build web app
        env:
          MONGOLGPT_CHANNEL: ${{ inputs.stage == 'production' && 'prod' || 'dev' }}
          VITE_MONGOLGPT_APP_URL: ${{ inputs.stage == 'production' && format('https://app.{0}', vars.MONGOLGPT_DOMAIN) || format('https://app.{0}.{1}', inputs.stage, vars.MONGOLGPT_DOMAIN) }}
          VITE_MONGOLGPT_PUBLIC_URL: ${{ inputs.stage == 'production' && format('https://{0}', vars.MONGOLGPT_DOMAIN) || format('https://{0}.{1}', inputs.stage, vars.MONGOLGPT_DOMAIN) }}
          VITE_MONGOLGPT_SERVER_URL: ${{ inputs.stage == 'production' && format('https://runtime.{0}', vars.MONGOLGPT_DOMAIN) || format('https://runtime.{0}.{1}', inputs.stage, vars.MONGOLGPT_DOMAIN) }}
        run: |
          bun --cwd packages/app build
          bun --cwd packages/app verify:hosted-artifact

  deploy:
    needs: verify
    if: github.repository == 'sergei10a-rgb/mongolgpt' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ inputs.stage }}
    env:
      MONGOLGPT_AUTH_EMAIL_DOMAINS: ${{ vars.MONGOLGPT_AUTH_EMAIL_DOMAINS }}
      CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Validate and deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCESS_API_TOKEN: ${{ inputs.admin && secrets.CLOUDFLARE_ACCESS_API_TOKEN || '' }}
          MONGOLGPT_RUNTIME_SECRET: ${{ secrets.MONGOLGPT_RUNTIME_SECRET }}
          MONGOLGPT_RUNTIME_AUTH_SECRET: ${{ secrets.MONGOLGPT_RUNTIME_AUTH_SECRET }}
          SST_SECRET_ByokCredentialsKeyV1: ${{ secrets.BYOK_CREDENTIALS_KEY_V1 }}
          SST_SECRET_D1BackupApiToken: ${{ secrets.D1_BACKUP_API_TOKEN }}
          SST_SECRET_GITHUB_CLIENT_ID_CONSOLE: ${{ vars.GITHUB_CLIENT_ID_CONSOLE }}
          SST_SECRET_GITHUB_CLIENT_SECRET_CONSOLE: ${{ secrets.GITHUB_CLIENT_SECRET_CONSOLE }}
          SST_SECRET_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          SST_SECRET_MONGOLGPT_PLAN_LIMITS: ${{ secrets.MONGOLGPT_PLAN_LIMITS }}
          SST_SECRET_MongolGPTRuntimeAuthSecret: ${{ secrets.MONGOLGPT_RUNTIME_AUTH_SECRET }}
          SST_SECRET_TurnstileSecretKey: ${{ inputs.stage == 'production' && secrets.TURNSTILE_SECRET_KEY || '1x0000000000000000000000000000000AA' }}
          SST_SECRET_ZEN_SESSION_SECRET: ${{ secrets.ZEN_SESSION_SECRET }}
          SST_SECRET_MongolGPTAdminBootstrapEmails: ${{ secrets.MONGOLGPT_ADMIN_BOOTSTRAP_EMAILS }}
          SST_SECRET_QPayMerchantAccountID: ${{ secrets.QPAY_MERCHANT_ACCOUNT_ID }}
          SST_SECRET_QPayClientID: ${{ secrets.QPAY_CLIENT_ID }}
          SST_SECRET_QPayClientSecret: ${{ secrets.QPAY_CLIENT_SECRET }}
          SST_SECRET_QPayInvoiceCode: ${{ secrets.QPAY_INVOICE_CODE }}
          SST_SECRET_BonumMerchantAccountID: ${{ secrets.BONUM_MERCHANT_ACCOUNT_ID }}
          SST_SECRET_BonumAppSecret: ${{ secrets.BONUM_APP_SECRET }}
          SST_SECRET_BonumTerminalID: ${{ secrets.BONUM_TERMINAL_ID }}
          SST_SECRET_BonumWebhookChecksumKey: ${{ secrets.BONUM_WEBHOOK_CHECKSUM_KEY }}
          SST_SECRET_ZEN_MODELS1: ${{ secrets.ZEN_MODELS1 }}
          SST_SECRET_ZEN_MODELS2: ${{ secrets.ZEN_MODELS2 }}
          SST_SECRET_ZEN_MODELS3: ${{ secrets.ZEN_MODELS3 }}
          SST_SECRET_ZEN_MODELS4: ${{ secrets.ZEN_MODELS4 }}
          SST_SECRET_ZEN_MODELS5: ${{ secrets.ZEN_MODELS5 }}
          SST_SECRET_ZEN_MODELS6: ${{ secrets.ZEN_MODELS6 }}
          SST_SECRET_ZEN_MODELS7: ${{ secrets.ZEN_MODELS7 }}
          SST_SECRET_ZEN_MODELS8: ${{ secrets.ZEN_MODELS8 }}
          SST_SECRET_ZEN_MODELS9: ${{ secrets.ZEN_MODELS9 }}
          SST_SECRET_ZEN_MODELS10: ${{ secrets.ZEN_MODELS10 }}
          SST_SECRET_ZEN_MODELS11: ${{ secrets.ZEN_MODELS11 }}
          SST_SECRET_ZEN_MODELS12: ${{ secrets.ZEN_MODELS12 }}
          SST_SECRET_ZEN_MODELS13: ${{ secrets.ZEN_MODELS13 }}
          SST_SECRET_ZEN_MODELS14: ${{ secrets.ZEN_MODELS14 }}
          SST_SECRET_ZEN_MODELS15: ${{ secrets.ZEN_MODELS15 }}
          SST_SECRET_ZEN_MODELS16: ${{ secrets.ZEN_MODELS16 }}
          SST_SECRET_ZEN_MODELS17: ${{ secrets.ZEN_MODELS17 }}
          SST_SECRET_ZEN_MODELS18: ${{ secrets.ZEN_MODELS18 }}
          SST_SECRET_ZEN_MODELS19: ${{ secrets.ZEN_MODELS19 }}
          SST_SECRET_ZEN_MODELS20: ${{ secrets.ZEN_MODELS20 }}
          SST_SECRET_ZEN_MODELS21: ${{ secrets.ZEN_MODELS21 }}
          SST_SECRET_ZEN_MODELS22: ${{ secrets.ZEN_MODELS22 }}
          SST_SECRET_ZEN_MODELS23: ${{ secrets.ZEN_MODELS23 }}
          SST_SECRET_ZEN_MODELS24: ${{ secrets.ZEN_MODELS24 }}
          SST_SECRET_ZEN_MODELS25: ${{ secrets.ZEN_MODELS25 }}
          SST_SECRET_ZEN_MODELS26: ${{ secrets.ZEN_MODELS26 }}
          SST_SECRET_ZEN_MODELS27: ${{ secrets.ZEN_MODELS27 }}
          SST_SECRET_ZEN_MODELS28: ${{ secrets.ZEN_MODELS28 }}
          SST_SECRET_ZEN_MODELS29: ${{ secrets.ZEN_MODELS29 }}
          SST_SECRET_ZEN_MODELS30: ${{ secrets.ZEN_MODELS30 }}
        run: |
          bun run deploy:preflight -- ${{ inputs.stage }}
          stage="${{ inputs.stage }}"
          payment_environment="${{ inputs.payment_environment }}"
          while IFS= read -r variable; do
            name="${variable#SST_SECRET_}"
            if [[ "$name" = MongolGPTAdmin* && "${{ inputs.admin }}" != "true" ]]; then
              continue
            fi
            if [[ "$name" = QPay* || "$name" = Bonum* ]] && [[ "$payment_environment" = "disabled" ]]; then
              value="disabled"
            else
              value="${!variable}"
              # A space clears stale optional model chunks while remaining valid JSON whitespace.
              if [ -z "$value" ]; then value=" "; fi
            fi
            printf '%s' "$value" | bun sst secret set "$name" --stage="$stage"
          done < <(compgen -A variable SST_SECRET_ | sort -V)
          if [ "$stage" = "production" ]; then
            runtime_channel="latest"
          else
            runtime_channel="dev"
          fi
          runtime_version="$(node -p "require('./packages/mongolgpt/package.json').version")"
          MONGOLGPT_CHANNEL="$runtime_channel" MONGOLGPT_VERSION="$runtime_version" bun run --cwd packages/mongolgpt build --single --skip-embed-web-ui --skip-install
          cp packages/mongolgpt/dist/mongolgpt-linux-x64/bin/mongolgpt packages/runtime/container/mongolgpt
          runtime_secrets="$RUNNER_TEMP/mongolgpt-runtime-secrets.json"
          trap 'rm -f "$runtime_secrets"' EXIT
          node -e 'require("node:fs").writeFileSync(process.argv[1], JSON.stringify({ MONGOLGPT_RUNTIME_SECRET: process.env.MONGOLGPT_RUNTIME_SECRET, MONGOLGPT_RUNTIME_AUTH_SECRET: process.env.MONGOLGPT_RUNTIME_AUTH_SECRET }))' "$runtime_secrets"
          bun --cwd packages/runtime wrangler deploy --config="wrangler.$stage.jsonc" --secrets-file="$runtime_secrets"
          bun sst unlock --stage=${{ inputs.stage }} || true
          bun sst deploy --stage=${{ inputs.stage }} --target Database --print-logs
          bun sst shell --stage=${{ inputs.stage }} -- bun run db:migrate
          bun sst deploy --stage=${{ inputs.stage }} --print-logs

      - name: Verify deployed URLs
        run: bun run deploy:smoke -- ${{ inputs.stage }}

      - name: Read Playwright version
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./package.json").workspaces.catalog["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright system dependencies
        working-directory: packages/app
        run: bunx playwright install-deps chromium

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/app
        run: bunx playwright install chromium

      - name: Verify deployed app in Chromium
        env:
          CI: true
          PLAYWRIGHT_DEPLOYED_BASE_URL: ${{ inputs.stage == 'production' && format('https://app.{0}', vars.MONGOLGPT_DOMAIN) || format('https://app.{0}.{1}', inputs.stage, vars.MONGOLGPT_DOMAIN) }}
          PLAYWRIGHT_DEPLOYED_PUBLIC_URL: ${{ inputs.stage == 'production' && format('https://{0}', vars.MONGOLGPT_DOMAIN) || format('https://{0}.{1}', inputs.stage, vars.MONGOLGPT_DOMAIN) }}
        run: bun --cwd packages/app test:e2e:deployed
        timeout-minutes: 10

      - name: Upload deployed browser artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployed-browser-${{ inputs.stage }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/app/e2e/test-results-deployed
            packages/app/e2e/playwright-report-deployed
