name: Cloudflare deploy

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Deploy хийх орчин"
        required: true
        type: choice
        default: dev
        options:
          - dev
          - production
      admin:
        description: "Cloudflare Access MFA хамгаалалттай admin.mgpt.mn-ийг асаах"
        required: true
        type: boolean
        default: false
      analytics:
        description: "Hosted deploy дээр Cloudflare D1 live stats-г асаах"
        required: true
        type: boolean
        default: false
      payment_environment:
        description: "Bonum + QPay төлбөрийн орчин"
        required: true
        type: choice
        default: disabled
        options:
          - disabled
          - sandbox
          - production
      production_confirmation:
        description: "Production бол DEPLOY <domain> гэж яг бичнэ"
        required: false
        type: string
      real_payment_confirmation:
        description: "Бодит төлбөр бол ENABLE REAL PAYMENTS <domain> гэж яг бичнэ"
        required: false
        type: string

concurrency:
  group: cloudflare-deploy-${{ inputs.stage }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MONGOLGPT_RELEASE_SHA: ${{ github.sha }}
  MONGOLGPT_DOMAIN: ${{ vars.MONGOLGPT_DOMAIN }}
  MONGOLGPT_ENABLE_HOSTED_SERVICES: "true"
  MONGOLGPT_ENABLE_ADMIN: ${{ inputs.admin }}
  MONGOLGPT_ENABLE_ANALYTICS: ${{ inputs.analytics }}
  MONGOLGPT_ENABLE_D1_BACKUPS: ${{ inputs.stage == 'production' && 'true' || 'false' }}
  MONGOLGPT_ENABLE_BUSINESS_INTEGRATIONS: "false"
  MONGOLGPT_ENABLE_LEGACY_STRIPE: "false"
  MONGOLGPT_ENABLE_MONITORING: "true"
  MONGOLGPT_ENABLE_ROOT_PREVIEW_ALIAS: ${{ inputs.stage == 'dev' && 'true' || 'false' }}
  MONGOLGPT_ENABLE_TURNSTILE: "true"
  MONGOLGPT_TURNSTILE_SITE_KEY: ${{ inputs.stage == 'production' && vars.MONGOLGPT_TURNSTILE_SITE_KEY || '1x00000000000000000000AA' }}
  MONGOLGPT_ENABLE_SHARE_SERVICE: "false"
  MONGOLGPT_ENABLE_SYNC_SERVICE: "false"
  MONGOLGPT_PRODUCTION_CONFIRMATION: ${{ inputs.production_confirmation }}
  MONGOLGPT_PAYMENT_ENVIRONMENT: ${{ inputs.payment_environment }}
  MONGOLGPT_PAYMENT_PLAN_CATALOG: ${{ vars.MONGOLGPT_PAYMENT_PLAN_CATALOG }}
  MONGOLGPT_ENABLE_REAL_PAYMENTS: ${{ inputs.payment_environment == 'production' && 'true' || 'false' }}
  MONGOLGPT_REAL_PAYMENT_CONFIRMATION: ${{ inputs.real_payment_confirmation }}

jobs:
  verify:
    if: github.repository == 'sergei10a-rgb/mongolgpt' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      app_url: ${{ steps.service-urls.outputs.app_url }}
      channel: ${{ steps.service-urls.outputs.channel }}
      payment_url: ${{ steps.service-urls.outputs.payment_url }}
      public_url: ${{ steps.service-urls.outputs.public_url }}
      runtime_url: ${{ steps.service-urls.outputs.runtime_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Resolve hosted service URLs
        id: service-urls
        run: bun script/deployment-service-urls.ts "${{ inputs.stage }}"

      - name: Typecheck
        run: bun typecheck

      - name: Test deployment contracts
        run: |
          bun run --cwd packages/script test
          bun run --cwd packages/console/admin test
          bun run --cwd packages/console/core test
          bun run --cwd packages/runtime-auth test
          bun run --cwd packages/runtime test

      - name: Verify hosted authentication
        working-directory: packages/console/app
        run: |
          bun test
          bun run typecheck

      - name: Verify admin application
        run: |
          bun run --cwd packages/console/admin typecheck
          bun run --cwd packages/console/admin build

      - name: Build docs
        run: |
          MONGOLGPT_STATIC_DOCS=true bun run build:docs
          bun run --cwd packages/web verify:static-artifact

      - name: Build web app
        env:
          MONGOLGPT_CHANNEL: ${{ steps.service-urls.outputs.channel }}
          VITE_MONGOLGPT_APP_URL: ${{ steps.service-urls.outputs.app_url }}
          VITE_MONGOLGPT_PUBLIC_URL: ${{ steps.service-urls.outputs.public_url }}
          VITE_MONGOLGPT_RELEASE_SHA: ${{ github.sha }}
          VITE_MONGOLGPT_SERVER_URL: ${{ steps.service-urls.outputs.runtime_url }}
        run: |
          bun --cwd packages/app build
          bun --cwd packages/app verify:hosted-artifact

  deploy:
    needs: verify
    if: github.repository == 'sergei10a-rgb/mongolgpt' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ inputs.stage }}
    env:
      MONGOLGPT_AUTH_EMAIL_DOMAINS: ${{ vars.MONGOLGPT_AUTH_EMAIL_DOMAINS }}
      CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Validate authenticated smoke identity
        env:
          MONGOLGPT_SMOKE_AUTH_COOKIE: ${{ secrets.MONGOLGPT_SMOKE_AUTH_COOKIE }}
        run: bun script/deployment-smoke.ts --validate-auth-cookie

      - name: Prepare managed Free Auto catalog without logging provider keys
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          NVIDIA_NIM_MODEL_ID: ${{ vars.NVIDIA_NIM_MODEL_ID }}
          MONGOLGPT_GATEWAY_MODELS1: ${{ secrets.MONGOLGPT_GATEWAY_MODELS1 }}
          MONGOLGPT_GATEWAY_MODELS2: ${{ secrets.MONGOLGPT_GATEWAY_MODELS2 }}
          MONGOLGPT_GATEWAY_MODELS3: ${{ secrets.MONGOLGPT_GATEWAY_MODELS3 }}
          MONGOLGPT_GATEWAY_MODELS4: ${{ secrets.MONGOLGPT_GATEWAY_MODELS4 }}
          MONGOLGPT_GATEWAY_MODELS5: ${{ secrets.MONGOLGPT_GATEWAY_MODELS5 }}
          MONGOLGPT_GATEWAY_MODELS6: ${{ secrets.MONGOLGPT_GATEWAY_MODELS6 }}
          MONGOLGPT_GATEWAY_MODELS7: ${{ secrets.MONGOLGPT_GATEWAY_MODELS7 }}
          MONGOLGPT_GATEWAY_MODELS8: ${{ secrets.MONGOLGPT_GATEWAY_MODELS8 }}
          MONGOLGPT_GATEWAY_MODELS9: ${{ secrets.MONGOLGPT_GATEWAY_MODELS9 }}
          MONGOLGPT_GATEWAY_MODELS10: ${{ secrets.MONGOLGPT_GATEWAY_MODELS10 }}
          MONGOLGPT_GATEWAY_MODELS11: ${{ secrets.MONGOLGPT_GATEWAY_MODELS11 }}
          MONGOLGPT_GATEWAY_MODELS12: ${{ secrets.MONGOLGPT_GATEWAY_MODELS12 }}
          MONGOLGPT_GATEWAY_MODELS13: ${{ secrets.MONGOLGPT_GATEWAY_MODELS13 }}
          MONGOLGPT_GATEWAY_MODELS14: ${{ secrets.MONGOLGPT_GATEWAY_MODELS14 }}
          MONGOLGPT_GATEWAY_MODELS15: ${{ secrets.MONGOLGPT_GATEWAY_MODELS15 }}
          MONGOLGPT_GATEWAY_MODELS16: ${{ secrets.MONGOLGPT_GATEWAY_MODELS16 }}
          MONGOLGPT_GATEWAY_MODELS17: ${{ secrets.MONGOLGPT_GATEWAY_MODELS17 }}
          MONGOLGPT_GATEWAY_MODELS18: ${{ secrets.MONGOLGPT_GATEWAY_MODELS18 }}
          MONGOLGPT_GATEWAY_MODELS19: ${{ secrets.MONGOLGPT_GATEWAY_MODELS19 }}
          MONGOLGPT_GATEWAY_MODELS20: ${{ secrets.MONGOLGPT_GATEWAY_MODELS20 }}
          MONGOLGPT_GATEWAY_MODELS21: ${{ secrets.MONGOLGPT_GATEWAY_MODELS21 }}
          MONGOLGPT_GATEWAY_MODELS22: ${{ secrets.MONGOLGPT_GATEWAY_MODELS22 }}
          MONGOLGPT_GATEWAY_MODELS23: ${{ secrets.MONGOLGPT_GATEWAY_MODELS23 }}
          MONGOLGPT_GATEWAY_MODELS24: ${{ secrets.MONGOLGPT_GATEWAY_MODELS24 }}
          MONGOLGPT_GATEWAY_MODELS25: ${{ secrets.MONGOLGPT_GATEWAY_MODELS25 }}
          MONGOLGPT_GATEWAY_MODELS26: ${{ secrets.MONGOLGPT_GATEWAY_MODELS26 }}
          MONGOLGPT_GATEWAY_MODELS27: ${{ secrets.MONGOLGPT_GATEWAY_MODELS27 }}
          MONGOLGPT_GATEWAY_MODELS28: ${{ secrets.MONGOLGPT_GATEWAY_MODELS28 }}
          MONGOLGPT_GATEWAY_MODELS29: ${{ secrets.MONGOLGPT_GATEWAY_MODELS29 }}
          MONGOLGPT_GATEWAY_MODELS30: ${{ secrets.MONGOLGPT_GATEWAY_MODELS30 }}
        run: bun script/prepare-dev-free-auto.ts

      - name: Validate and deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCESS_API_TOKEN: ${{ inputs.admin && secrets.CLOUDFLARE_ACCESS_API_TOKEN || '' }}
          MONGOLGPT_MONITOR_ALERT_EMAIL: ${{ secrets.MONGOLGPT_MONITOR_ALERT_EMAIL }}
          MONGOLGPT_RUNTIME_SECRET: ${{ secrets.MONGOLGPT_RUNTIME_SECRET }}
          MONGOLGPT_RUNTIME_AUTH_SECRET: ${{ secrets.MONGOLGPT_RUNTIME_AUTH_SECRET }}
          SST_SECRET_ByokCredentialsKeyV1: ${{ secrets.BYOK_CREDENTIALS_KEY_V1 }}
          SST_SECRET_D1BackupApiToken: ${{ secrets.D1_BACKUP_API_TOKEN }}
          SST_SECRET_GITHUB_CLIENT_ID_CONSOLE: ${{ vars.MONGOLGPT_GITHUB_OAUTH_CLIENT_ID }}
          SST_SECRET_GITHUB_CLIENT_SECRET_CONSOLE: ${{ secrets.MONGOLGPT_GITHUB_OAUTH_CLIENT_SECRET }}
          SST_SECRET_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          SST_SECRET_MONGOLGPT_PLAN_LIMITS: ${{ secrets.MONGOLGPT_PLAN_LIMITS }}
          SST_SECRET_MongolGPTRuntimeAuthSecret: ${{ secrets.MONGOLGPT_RUNTIME_AUTH_SECRET }}
          SST_SECRET_TurnstileSecretKey: ${{ inputs.stage == 'production' && secrets.TURNSTILE_SECRET_KEY || '1x0000000000000000000000000000000AA' }}
          SST_SECRET_MONGOLGPT_GATEWAY_SESSION_SECRET: ${{ secrets.MONGOLGPT_GATEWAY_SESSION_SECRET }}
          SST_SECRET_MongolGPTAdminBootstrapEmails: ${{ secrets.MONGOLGPT_ADMIN_BOOTSTRAP_EMAILS }}
          SST_SECRET_QPayMerchantAccountID: ${{ secrets.QPAY_MERCHANT_ACCOUNT_ID }}
          SST_SECRET_QPayClientID: ${{ secrets.QPAY_CLIENT_ID }}
          SST_SECRET_QPayClientSecret: ${{ secrets.QPAY_CLIENT_SECRET }}
          SST_SECRET_QPayInvoiceCode: ${{ secrets.QPAY_INVOICE_CODE }}
          SST_SECRET_BonumMerchantAccountID: ${{ secrets.BONUM_MERCHANT_ACCOUNT_ID }}
          SST_SECRET_BonumAppSecret: ${{ secrets.BONUM_APP_SECRET }}
          SST_SECRET_BonumTerminalID: ${{ secrets.BONUM_TERMINAL_ID }}
          SST_SECRET_BonumWebhookChecksumKey: ${{ secrets.BONUM_WEBHOOK_CHECKSUM_KEY }}
        run: |
          bun run deploy:preflight -- ${{ inputs.stage }}
          stage="${{ inputs.stage }}"
          payment_environment="${{ inputs.payment_environment }}"
          while IFS= read -r variable; do
            name="${variable#SST_SECRET_}"
            if [[ "$name" = MongolGPTAdmin* && "${{ inputs.admin }}" != "true" ]]; then
              continue
            fi
            if [[ "$name" = QPay* || "$name" = Bonum* ]] && [[ "$payment_environment" = "disabled" ]]; then
              value="disabled"
            else
              value="${!variable}"
              # A space clears stale optional model chunks while remaining valid JSON whitespace.
              if [ -z "$value" ]; then value=" "; fi
            fi
            printf '%s' "$value" | bun sst secret set "$name" --stage="$stage"
          done < <(compgen -A variable SST_SECRET_ | sort -V)
          if [ "$stage" = "production" ]; then
            runtime_channel="latest"
          else
            runtime_channel="dev"
          fi
          runtime_version="$(node -p "require('./packages/mongolgpt/package.json').version")"
          MONGOLGPT_CHANNEL="$runtime_channel" MONGOLGPT_VERSION="$runtime_version" bun run --cwd packages/mongolgpt build --single --skip-embed-web-ui --skip-install
          cp packages/mongolgpt/dist/mongolgpt-linux-x64/bin/mongolgpt packages/runtime/container/mongolgpt
          runtime_secrets="$RUNNER_TEMP/mongolgpt-runtime-secrets.json"
          trap 'rm -f "$runtime_secrets"' EXIT
          node -e 'require("node:fs").writeFileSync(process.argv[1], JSON.stringify({ MONGOLGPT_RUNTIME_SECRET: process.env.MONGOLGPT_RUNTIME_SECRET, MONGOLGPT_RUNTIME_AUTH_SECRET: process.env.MONGOLGPT_RUNTIME_AUTH_SECRET }))' "$runtime_secrets"
          bun sst unlock --stage=${{ inputs.stage }} || true
          set -o pipefail
          if ! database_id="$(bun sst state export --stage=${{ inputs.stage }} | bun script/resolve-sst-d1-state.ts)"; then
            echo "SST state-д Database алга. Schema-dependent service-ээс өмнө D1-ийг үүсгэж байна."
            MONGOLGPT_ENABLE_ROOT_PREVIEW_ALIAS=false \
              MONGOLGPT_DEPLOY_DATABASE_ONLY=true \
              bun sst deploy --stage=${{ inputs.stage }} --target Database --print-logs
            database_id="$(bun sst state export --stage=${{ inputs.stage }} | bun script/resolve-sst-d1-state.ts)"
          fi
          MONGOLGPT_DATABASE_ID="$database_id" bun run db:migrate
          unset database_id
          bun --cwd packages/runtime script/deploy.ts "$stage" --secrets-file="$runtime_secrets"
          bun sst deploy --stage=${{ inputs.stage }} --print-logs

      - name: Verify deployed URLs
        env:
          MONGOLGPT_SMOKE_AUTH_COOKIE: ${{ secrets.MONGOLGPT_SMOKE_AUTH_COOKIE }}
        run: bun run deploy:smoke -- ${{ inputs.stage }}

      - name: Verify sandbox payment providers
        if: inputs.payment_environment == 'sandbox'
        timeout-minutes: 3
        env:
          MONGOLGPT_PAYMENT_SANDBOX_SMOKE_CONFIRM: RUN_SANDBOX_SMOKE
          MONGOLGPT_PAYMENT_SANDBOX_ENVIRONMENT: sandbox
          MONGOLGPT_PAYMENT_SANDBOX_PROVIDER: all
          MONGOLGPT_PAYMENT_SANDBOX_CALLBACK_BASE_URL: ${{ needs.verify.outputs.payment_url }}
          QPAY_MERCHANT_ACCOUNT_ID: ${{ secrets.QPAY_MERCHANT_ACCOUNT_ID }}
          QPAY_CLIENT_ID: ${{ secrets.QPAY_CLIENT_ID }}
          QPAY_CLIENT_SECRET: ${{ secrets.QPAY_CLIENT_SECRET }}
          QPAY_INVOICE_CODE: ${{ secrets.QPAY_INVOICE_CODE }}
          BONUM_MERCHANT_ACCOUNT_ID: ${{ secrets.BONUM_MERCHANT_ACCOUNT_ID }}
          BONUM_APP_SECRET: ${{ secrets.BONUM_APP_SECRET }}
          BONUM_TERMINAL_ID: ${{ secrets.BONUM_TERMINAL_ID }}
          BONUM_WEBHOOK_CHECKSUM_KEY: ${{ secrets.BONUM_WEBHOOK_CHECKSUM_KEY }}
        run: bun --cwd packages/console/core payment-sandbox-smoke

      - name: Read Playwright version
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./package.json").workspaces.catalog["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright system dependencies
        working-directory: packages/app
        run: bunx playwright install-deps chromium

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/app
        run: bunx playwright install chromium

      - name: Verify deployed app in Chromium
        env:
          CI: true
          PLAYWRIGHT_DEPLOYED_BASE_URL: ${{ needs.verify.outputs.app_url }}
          PLAYWRIGHT_DEPLOYED_PUBLIC_URL: ${{ needs.verify.outputs.public_url }}
          PLAYWRIGHT_DEPLOYED_RUNTIME_URL: ${{ needs.verify.outputs.runtime_url }}
          PLAYWRIGHT_DEPLOYED_RELEASE_SHA: ${{ github.sha }}
          MONGOLGPT_SMOKE_AUTH_COOKIE: ${{ secrets.MONGOLGPT_SMOKE_AUTH_COOKIE }}
        run: bun --cwd packages/app test:e2e:deployed
        timeout-minutes: 10

      - name: Verify deployed docs search in Chromium
        env:
          CI: "true"
          PLAYWRIGHT_DEPLOYED_DOCS_URL: ${{ inputs.stage == 'production' && 'https://docs.mgpt.mn/docs/' || 'https://docs.dev.mgpt.mn/docs/' }}
        run: bun --cwd packages/web test:e2e:deployed
        timeout-minutes: 10

      - name: Upload deployed browser artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployed-browser-${{ inputs.stage }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/app/e2e/test-results-deployed
            packages/app/e2e/playwright-report-deployed
            packages/web/e2e/test-results-deployed
            packages/web/e2e/playwright-report-deployed
