name: mongolgpt

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  mongolgpt:
    if: |
      contains(github.event.comment.body, ' /mongolgpt') ||
      startsWith(github.event.comment.body, '/mongolgpt')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-bun

      - name: Run mongolgpt
        uses: sergei10a-rgb/mongolgpt/github@mongolgpt-github-v1.0.0
        env:
          MONGOLGPT_API_KEY: ${{ secrets.MONGOLGPT_API_KEY }}
          MONGOLGPT_PERMISSION: '{"bash": "deny"}'
        with:
          model: mongolgpt/claude-opus-4-5
