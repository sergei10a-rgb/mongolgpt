name: Reconcile dev admin Access state

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Audit only by default; reconcile requires separate confirmation"
        type: choice
        required: true
        default: audit
        options: [audit, reconcile]
      confirmation:
        description: "For reconcile only: CONFIRM DEV ADMIN COOKIE STATE"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy-dev
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository == 'sergei10a-rgb/mongolgpt' && github.ref == 'refs/heads/main'
    environment: dev
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      MONGOLGPT_DOMAIN: ${{ vars.MONGOLGPT_DOMAIN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
      CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
    steps:
      - name: Validate operation and explicit reconciliation confirmation
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          case "$OPERATION" in
            audit) ;;
            reconcile) test "$CONFIRMATION" = "CONFIRM DEV ADMIN COOKIE STATE" ;;
            *) exit 1 ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Verify bounded reconciliation contracts
        run: bun test --cwd packages/script test/admin-access-state.test.ts test/cloudflare-access.test.ts

      - name: Audit and optionally reconcile only recorded dev cookie attributes
        env:
          OPERATION: ${{ inputs.operation }}
          MONGOLGPT_RECONCILE_ADMIN_ACCESS_STATE: ${{ inputs.confirmation }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
          SST_SECRET_MongolGPTAdminBootstrapEmails: ${{ secrets.MONGOLGPT_ADMIN_BOOTSTRAP_EMAILS }}
        run: |
          set -euo pipefail
          umask 077
          state_file="$RUNNER_TEMP/mongolgpt-admin-cookie-state.json"
          log_file="$RUNNER_TEMP/mongolgpt-admin-cookie-state.log"
          backup_file="$RUNNER_TEMP/mongolgpt-admin-cookie-state-before.json"
          plan_file="$RUNNER_TEMP/mongolgpt-admin-cookie-plan.json"
          trap 'rm -f "$state_file" "$log_file" "$backup_file" "$plan_file"' EXIT
          if ! bun sst state export --config sst.admin.config.ts --stage=dev >"$state_file" 2>"$log_file"; then
            echo "Dev admin state export failed. Confidential output withheld."
            exit 1
          fi
          bun script/reconcile-admin-access-state.ts --audit <"$state_file" >"$plan_file"
          needs_reconciliation="$(bun -e 'const p = await Bun.stdin.json(); if (typeof p.changed !== "boolean" || p.liveProtectionVerified !== true) process.exit(1); console.log(p.changed)' <"$plan_file")"
          echo "Live protection verified; state reconciliation required: $needs_reconciliation"
          if [ "$OPERATION" = "reconcile" ] && [ "$needs_reconciliation" = "true" ]; then
            # SST 4.17.1 state edit persists a backend snapshot. The first editor leaves all bytes unchanged.
            # Only after that snapshot succeeds may a second locked editor reconcile the same baseline.
            if ! EDITOR="bun script/reconcile-admin-access-state.ts --snapshot" bun sst state edit --config sst.admin.config.ts --stage=dev >"$log_file" 2>&1; then
              echo "Protected baseline snapshot failed. No cookie state repair was attempted."
              exit 1
            fi
            if ! EDITOR="bun script/reconcile-admin-access-state.ts --edit" bun sst state edit --config sst.admin.config.ts --stage=dev >"$log_file" 2>&1; then
              echo "Dev admin state editor failed. Confidential output withheld; do not retry blindly."
              exit 1
            fi
            if ! bun sst state export --config sst.admin.config.ts --stage=dev >"$state_file" 2>"$log_file"; then
              echo "Post-edit state export failed; reconciliation is not verified."
              exit 1
            fi
            bun script/reconcile-admin-access-state.ts --verify <"$state_file"
          fi
