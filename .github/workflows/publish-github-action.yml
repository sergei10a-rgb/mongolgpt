name: Verify published MongolGPT GitHub Action

on:
  push:
    tags:
      - "mongolgpt-github-v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'sergei10a-rgb/mongolgpt'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout immutable action tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Verify published action contract
        run: |
          ./github/script/publish
          bun run --cwd packages/mongolgpt test test/cli/github-action.test.ts
