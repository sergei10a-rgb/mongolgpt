name: Deploy dev docs

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "DEPLOY DEV DOCS docs.dev.mgpt.mn гэж яг бичнэ"
        required: true
        type: string

concurrency:
  group: cloudflare-deploy-dev-docs
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MONGOLGPT_DOMAIN: ${{ vars.MONGOLGPT_DOMAIN }}
  MONGOLGPT_PUBLIC_URL: https://docs.dev.mgpt.mn
  MONGOLGPT_CONSOLE_URL: https://dev.mgpt.mn
  MONGOLGPT_SUPPORT_URL: https://dev.mgpt.mn/mn/support
  MONGOLGPT_ENABLE_HOSTED_SERVICES: "false"
  MONGOLGPT_ENABLE_ADMIN: "false"
  MONGOLGPT_ENABLE_ANALYTICS: "false"
  MONGOLGPT_ENABLE_D1_BACKUPS: "false"
  MONGOLGPT_ENABLE_BUSINESS_INTEGRATIONS: "false"
  MONGOLGPT_ENABLE_LEGACY_STRIPE: "false"
  MONGOLGPT_ENABLE_MONITORING: "false"
  MONGOLGPT_ENABLE_TURNSTILE: "false"
  MONGOLGPT_ENABLE_SHARE_SERVICE: "false"
  MONGOLGPT_ENABLE_SYNC_SERVICE: "false"
  MONGOLGPT_ENABLE_REAL_PAYMENTS: "false"
  MONGOLGPT_PAYMENT_ENVIRONMENT: disabled

jobs:
  deploy:
    if: github.repository == 'sergei10a-rgb/mongolgpt' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: dev
    env:
      CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - name: Validate exact dev docs confirmation
        env:
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$DEPLOY_CONFIRMATION" != "DEPLOY DEV DOCS docs.dev.mgpt.mn" ]; then
            echo "Dev docs deploy баталгаажуулалт буруу байна."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Verify static docs artifact
        run: |
          bun run --cwd packages/web test
          bun run --cwd packages/script test
          MONGOLGPT_STATIC_DOCS=true bun run build:docs
          bun run --cwd packages/web verify:static-artifact

      - name: Deploy only dev docs to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MONGOLGPT_DEPLOY_DOCS_ONLY: "true"
        run: |
          bun run deploy:preflight -- dev --docs-only
          bun sst unlock --stage=dev || true
          bun sst deploy --stage=dev --target Website --print-logs

      - name: Verify live dev docs
        env:
          MONGOLGPT_DEPLOY_DOCS_ONLY: "true"
        run: bun script/deployment-smoke.ts --docs-only dev

      - name: Read Playwright version
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./package.json").workspaces.catalog["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright system dependencies
        working-directory: packages/web
        run: bunx playwright install-deps chromium

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/web
        run: bunx playwright install chromium

      - name: Verify dev docs search in Chromium
        env:
          CI: "true"
          PLAYWRIGHT_DEPLOYED_DOCS_URL: https://docs.dev.mgpt.mn/docs/
        run: bun --cwd packages/web test:e2e:deployed
        timeout-minutes: 10

      - name: Upload docs browser artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployed-browser-dev-docs-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/web/e2e/test-results-deployed
            packages/web/e2e/playwright-report-deployed
