name: Bootstrap dev OAuth

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "BOOTSTRAP DEV AUTH dev.mgpt.mn гэж яг бичнэ"
        required: true
        type: string
      cloudflare_provider_stepping_stone:
        description: "Хуучин Cloudflare queue state-ийг provider 6.14-өөр нэг удаа шилжүүлэх"
        required: false
        default: false
        type: boolean

concurrency:
  group: cloudflare-bootstrap-dev-auth
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MONGOLGPT_DOMAIN: ${{ vars.MONGOLGPT_DOMAIN }}
  MONGOLGPT_ENABLE_HOSTED_SERVICES: "true"
  MONGOLGPT_ENABLE_ADMIN: "false"
  MONGOLGPT_ENABLE_ANALYTICS: "false"
  MONGOLGPT_ENABLE_D1_BACKUPS: "false"
  MONGOLGPT_ENABLE_BUSINESS_INTEGRATIONS: "false"
  MONGOLGPT_ENABLE_LEGACY_STRIPE: "false"
  MONGOLGPT_ENABLE_MONITORING: "false"
  MONGOLGPT_ENABLE_TURNSTILE: "true"
  MONGOLGPT_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
  MONGOLGPT_ENABLE_SHARE_SERVICE: "false"
  MONGOLGPT_ENABLE_SYNC_SERVICE: "false"
  MONGOLGPT_ENABLE_REAL_PAYMENTS: "false"
  MONGOLGPT_PAYMENT_ENVIRONMENT: disabled

jobs:
  bootstrap:
    if: github.repository == 'sergei10a-rgb/mongolgpt' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: dev
    env:
      MONGOLGPT_AUTH_EMAIL_DOMAINS: ${{ vars.MONGOLGPT_AUTH_EMAIL_DOMAINS }}
      CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
    steps:
      - name: Validate exact dev bootstrap confirmation
        env:
          BOOTSTRAP_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$BOOTSTRAP_CONFIRMATION" != "BOOTSTRAP DEV AUTH dev.mgpt.mn" ]; then
            echo "Dev OAuth bootstrap баталгаажуулалт буруу байна."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Verify dev OAuth bootstrap configuration
        env:
          MONGOLGPT_RUNTIME_AUTH_SECRET: ${{ secrets.MONGOLGPT_RUNTIME_AUTH_SECRET }}
          SST_SECRET_ByokCredentialsKeyV1: ${{ secrets.BYOK_CREDENTIALS_KEY_V1 }}
          SST_SECRET_GITHUB_CLIENT_ID_CONSOLE: ${{ vars.MONGOLGPT_GITHUB_OAUTH_CLIENT_ID }}
          SST_SECRET_GITHUB_CLIENT_SECRET_CONSOLE: ${{ secrets.MONGOLGPT_GITHUB_OAUTH_CLIENT_SECRET }}
          SST_SECRET_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          SST_SECRET_MONGOLGPT_PLAN_LIMITS: ${{ secrets.MONGOLGPT_PLAN_LIMITS }}
          SST_SECRET_MongolGPTRuntimeAuthSecret: ${{ secrets.MONGOLGPT_RUNTIME_AUTH_SECRET }}
          SST_SECRET_TurnstileSecretKey: "1x0000000000000000000000000000000AA"
          SST_SECRET_MONGOLGPT_GATEWAY_SESSION_SECRET: ${{ secrets.MONGOLGPT_GATEWAY_SESSION_SECRET }}
        run: bun run deploy:preflight -- dev --auth-bootstrap --config-only

      - name: Verify Cloudflare OAuth bootstrap token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun script/cloudflare-preflight.ts --auth-bootstrap

      - name: Verify bootstrap contracts
        run: |
          bun typecheck
          bun run --cwd packages/script test
          bun test --cwd packages/console/app

      - name: Migrate legacy Cloudflare queue state through provider 6.14
        if: inputs.cloudflare_provider_stepping_stone
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MONGOLGPT_CLOUDFLARE_PROVIDER_MIGRATION: "true"
        run: |
          bunx sst@4.7.0 unlock --stage=dev || true
          bunx sst@4.7.0 refresh \
            --stage=dev \
            --target UsageDeadLetterQueue \
            --print-logs
          bunx sst@4.7.0 refresh \
            --stage=dev \
            --target UsageQueue \
            --print-logs

      - name: Bootstrap real dev OAuth infrastructure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MONGOLGPT_RUNTIME_AUTH_SECRET: ${{ secrets.MONGOLGPT_RUNTIME_AUTH_SECRET }}
          SST_SECRET_ByokCredentialsKeyV1: ${{ secrets.BYOK_CREDENTIALS_KEY_V1 }}
          SST_SECRET_GITHUB_CLIENT_ID_CONSOLE: ${{ vars.MONGOLGPT_GITHUB_OAUTH_CLIENT_ID }}
          SST_SECRET_GITHUB_CLIENT_SECRET_CONSOLE: ${{ secrets.MONGOLGPT_GITHUB_OAUTH_CLIENT_SECRET }}
          SST_SECRET_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          SST_SECRET_MONGOLGPT_PLAN_LIMITS: ${{ secrets.MONGOLGPT_PLAN_LIMITS }}
          SST_SECRET_MongolGPTRuntimeAuthSecret: ${{ secrets.MONGOLGPT_RUNTIME_AUTH_SECRET }}
          SST_SECRET_TurnstileSecretKey: "1x0000000000000000000000000000000AA"
          SST_SECRET_MONGOLGPT_GATEWAY_SESSION_SECRET: ${{ secrets.MONGOLGPT_GATEWAY_SESSION_SECRET }}
        run: |
          stage="dev"
          print_pulumi_error() {
            status="$?"
            if [ "$status" -ne 0 ] && [ -f .sst/log/pulumi.err ]; then
              echo "Pulumi state integrity diagnostic:"
              sed -n '1,160p' .sst/log/pulumi.err
            fi
            exit "$status"
          }
          trap print_pulumi_error EXIT
          set_required_secret() {
            name="$1"
            variable="SST_SECRET_${name}"
            value="${!variable}"
            if [ -z "$value" ]; then
              echo "Bootstrap secret дутуу байна: $name"
              exit 1
            fi
            printf '%s' "$value" | bun sst secret set "$name" --stage="$stage"
          }
          set_optional_secret() {
            name="$1"
            variable="SST_SECRET_${name}"
            value="${!variable}"
            if [ -z "$value" ]; then value=" "; fi
            printf '%s' "$value" | bun sst secret set "$name" --stage="$stage"
          }
          for name in \
            ByokCredentialsKeyV1 \
            MONGOLGPT_PLAN_LIMITS \
            MongolGPTRuntimeAuthSecret \
            TurnstileSecretKey \
            MONGOLGPT_GATEWAY_SESSION_SECRET; do
            set_required_secret "$name"
          done
          set_optional_secret GITHUB_CLIENT_ID_CONSOLE
          set_optional_secret GITHUB_CLIENT_SECRET_CONSOLE
          set_optional_secret GOOGLE_CLIENT_ID
          bun sst unlock --stage="$stage" || true
          repair_log="$(mktemp)"
          set +e
          bun sst state repair --stage="$stage" --print-logs 2>&1 | tee "$repair_log"
          repair_status="${PIPESTATUS[0]}"
          set -e
          if [ "$repair_status" -ne 0 ] && ! grep -Fq "No changes made" "$repair_log"; then
            rm -f "$repair_log"
            exit "$repair_status"
          fi
          rm -f "$repair_log"
          bun sst deploy --stage="$stage" --target Database --print-logs
          bun sst shell --stage="$stage" -- bun run db:migrate
          bun sst deploy --stage="$stage" --target AuthApi --target Console --print-logs
          trap - EXIT

      - name: Verify dev account scaffold
        run: bun script/deployment-smoke.ts --auth-bootstrap dev
