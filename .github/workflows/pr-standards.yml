name: pr-standards

on:
  pull_request_target:
    types: [opened, edited, synchronize]

jobs:
  check-standards:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check PR standards
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const login = pr.user.login;

            // Skip PRs older than Feb 18, 2026 at 6PM EST (Feb 19, 2026 00:00 UTC)
            const cutoff = new Date('2026-02-19T00:00:00Z');
            const prCreated = new Date(pr.created_at);
            if (prCreated < cutoff) {
              console.log(`Skipping: PR #${pr.number} was created before cutoff (${prCreated.toISOString()})`);
              return;
            }

            // Check if author is a team member or bot
            if (login === 'mongolgpt-agent[bot]') return;
            const { data: file } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: '.github/TEAM_MEMBERS',
              ref: 'main'
            });
            const members = Buffer.from(file.content, 'base64').toString().split('\n').map(l => l.trim()).filter(Boolean);
            if (members.includes(login)) {
              console.log(`Skipping: ${login} is a team member`);
              return;
            }

            const title = pr.title;

            async function addLabel(label) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: [label]
              });
            }

            async function removeLabel(label) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: label
                });
              } catch (e) {
                // Label wasn't present, ignore
              }
            }

            async function comment(marker, body) {
              const markerText = `<!-- pr-standards:${marker} -->`;
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number
              });
              
              const existing = comments.find(c => c.body.includes(markerText));
              if (existing) return;
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: markerText + '\n' + body
              });
            }

            // Step 1: Check title format
            // Matches: feat:, feat(scope):, feat (scope):, etc.
            const titlePattern = /^(feat|fix|docs|chore|refactor|test)\s*(\([a-zA-Z0-9-]+\))?\s*:/;
            const hasValidTitle = titlePattern.test(title);

            if (!hasValidTitle) {
              await addLabel('needs:title');
              await comment('title', `Таны PR-ийн \`${title}\` гарчиг conventional commit хэлбэрт нийцэхгүй байна.

            Дараахын аль нэгээр эхлүүлнэ үү:
            - \`feat:\` эсвэл \`feat(scope):\` шинэ боломж
            - \`fix:\` эсвэл \`fix(scope):\` алдаа засвар
            - \`docs:\` эсвэл \`docs(scope):\` баримт бичгийн өөрчлөлт
            - \`chore:\` эсвэл \`chore(scope):\` арчилгаа
            - \`refactor:\` эсвэл \`refactor(scope):\` кодын бүтцийн сайжруулалт
            - \`test:\` эсвэл \`test(scope):\` тест нэмэх эсвэл шинэчлэх

            \`scope\` нь package-ийн нэр байна. Жишээ нь \`app\`, \`desktop\`, \`mongolgpt\`.

            Дэлгэрэнгүйг [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md)-ээс харна уу.`);
              return;
            }

            await removeLabel('needs:title');

            // Step 2: Check for linked issue (skip for docs/refactor/feat PRs)
            const skipIssueCheck = /^(docs|refactor|feat)\s*(\([a-zA-Z0-9-]+\))?\s*:/.test(title);
            if (skipIssueCheck) {
              await removeLabel('needs:issue');
              console.log('Skipping issue check for docs/refactor/feat PR');
              return;
            }
            const query = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 1) {
                      totalCount
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: pr.number
            });

            const linkedIssues = result.repository.pullRequest.closingIssuesReferences.totalCount;

            if (linkedIssues === 0) {
              await addLabel('needs:issue');
              await comment('issue', `Хувь нэмэр оруулж байгаад баярлалаа.

            Энэ PR-тэй холбоотой issue алга. PR бүр өмнө нь бүртгэсэн issue-тэй холбогдсон байна.

            Дараахыг хийнэ үү:
            1. Байхгүй бол алдаа эсвэл саналаа тайлбарласан issue нээх
            2. PR-ийн тайлбарт \`Fixes #<дугаар>\` эсвэл \`Closes #<дугаар>\` нэмэх

            Дэлгэрэнгүйг [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md)-ээс харна уу.`);
              return;
            }

            await removeLabel('needs:issue');
            console.log('PR meets all standards');

  check-compliance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check PR template compliance
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const login = pr.user.login;

            // Skip PRs older than Feb 18, 2026 at 6PM EST (Feb 19, 2026 00:00 UTC)
            const cutoff = new Date('2026-02-19T00:00:00Z');
            const prCreated = new Date(pr.created_at);
            if (prCreated < cutoff) {
              console.log(`Skipping: PR #${pr.number} was created before cutoff (${prCreated.toISOString()})`);
              return;
            }

            // Check if author is a team member or bot
            if (login === 'mongolgpt-agent[bot]') return;
            const { data: file } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: '.github/TEAM_MEMBERS',
              ref: 'main'
            });
            const members = Buffer.from(file.content, 'base64').toString().split('\n').map(l => l.trim()).filter(Boolean);
            if (members.includes(login)) {
              console.log(`Skipping: ${login} is a team member`);
              return;
            }

            const body = pr.body || '';
            const title = pr.title;
            const isDocsRefactorOrFeat = /^(docs|refactor|feat)\s*(\([a-zA-Z0-9-]+\))?\s*:/.test(title);

            const issues = [];

            // Check: template sections exist
            const hasWhatSection = /### Энэ PR юу хийж байгаа вэ\?/.test(body);
            const hasTypeSection = /### Өөрчлөлтийн төрөл/.test(body);
            const hasVerifySection = /### Код ажиллаж байгааг хэрхэн шалгасан бэ\?/.test(body);
            const hasChecklistSection = /### Шалгах жагсаалт/.test(body);
            const hasIssueSection = /### Энэ PR-ийн issue/.test(body);

            if (!hasWhatSection || !hasTypeSection || !hasVerifySection || !hasChecklistSection || !hasIssueSection) {
              issues.push('PR-ийн тайлбарт заавал байх хэсэг дутуу байна. [PR загвар](../blob/main/.github/pull_request_template.md)-ыг ашиглана уу.');
            }

            // Check: "What does this PR do?" has real content (not just placeholder text)
            if (hasWhatSection) {
              const whatMatch = body.match(/### Энэ PR юу хийж байгаа вэ\?\s*\n([\s\S]*?)(?=###|$)/);
              const whatContent = whatMatch ? whatMatch[1].trim() : '';
              const placeholder = 'Асуудал, хийсэн өөрчлөлт, яагаад зөв ажиллаж байгааг тайлбарлана уу.';
              const onlyPlaceholder = whatContent.includes(placeholder);
              if (!whatContent || onlyPlaceholder) {
                issues.push('"Энэ PR юу хийж байгаа вэ?" хэсэг хоосон эсвэл загварын тайлбараа арилгаагүй байна. Өөрчлөлтөө тайлбарлана уу.');
              }
            }

            // Check: at least one "Type of change" checkbox is checked
            if (hasTypeSection) {
              const typeMatch = body.match(/### Өөрчлөлтийн төрөл\s*\n([\s\S]*?)(?=###|$)/);
              const typeContent = typeMatch ? typeMatch[1] : '';
              const hasCheckedBox = /- \[x\]/i.test(typeContent);
              if (!hasCheckedBox) {
                issues.push('"Өөрчлөлтийн төрөл" хэсгээс дор хаяж нэг сонголтыг тэмдэглэнэ үү.');
              }
            }

            // Check: issue reference (skip for docs/refactor/feat)
            if (!isDocsRefactorOrFeat && hasIssueSection) {
              const issueMatch = body.match(/### Энэ PR-ийн issue\s*\n([\s\S]*?)(?=###|$)/);
              const issueContent = issueMatch ? issueMatch[1].trim() : '';
              const hasIssueRef = /(closes|fixes|resolves)\s+#\d+/i.test(issueContent) || /#\d+/.test(issueContent);
              if (!hasIssueRef) {
                issues.push('Холбоотой issue дурдаагүй байна. `Closes #<дугаар>` гэж нэмнэ үү.');
              }
            }

            // Check: "How did you verify" has content
            if (hasVerifySection) {
              const verifyMatch = body.match(/### Код ажиллаж байгааг хэрхэн шалгасан бэ\?\s*\n([\s\S]*?)(?=###|$)/);
              const verifyContent = verifyMatch ? verifyMatch[1].trim() : '';
              if (!verifyContent) {
                issues.push('"Код ажиллаж байгааг хэрхэн шалгасан бэ?" хэсэг хоосон байна. Ажиллуулсан тестээ тайлбарлана уу.');
              }
            }

            // Check: checklist boxes are checked
            if (hasChecklistSection) {
              const checklistMatch = body.match(/### Шалгах жагсаалт\s*\n([\s\S]*?)(?=###|$)/);
              const checklistContent = checklistMatch ? checklistMatch[1] : '';
              const unchecked = (checklistContent.match(/- \[ \]/g) || []).length;
              const checked = (checklistContent.match(/- \[x\]/gi) || []).length;
              if (checked < 2) {
                issues.push('Шалгах жагсаалтыг бүрэн тэмдэглэнэ үү. Локал тест хийсэн, хамааралгүй өөрчлөлт оруулаагүйгээ батална.');
              }
            }

            // Helper functions
            async function addLabel(label) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: [label]
              });
            }

            async function removeLabel(label) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: label
                });
              } catch (e) {}
            }

            const hasComplianceLabel = pr.labels.some(l => l.name === 'needs:compliance');

            if (issues.length > 0) {
              // Non-compliant
              if (!hasComplianceLabel) {
                await addLabel('needs:compliance');
              }

              const marker = '<!-- issue-compliance -->';
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number
              });
              const existing = comments.find(c => c.body.includes(marker));

              const body_text = `${marker}
            Энэ PR нь [хувь нэмэр оруулах заавар](../blob/main/CONTRIBUTING.md) болон [PR загвар](../blob/main/.github/pull_request_template.md)-ын шаардлагыг бүрэн хангахгүй байна.

            **Засах шаардлагатай зүйлс:**
            ${issues.map(i => `- ${i}`).join('\n')}

            Дээрхийг засаж PR-ийн тайлбараа **2 цагийн дотор** шинэчилнэ үү. Үгүй бол PR автоматаар хаагдана.

            Буруу тэмдэглэгдсэн гэж үзвэл maintainer-д мэдэгдэнэ үү.`;

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: body_text
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: body_text
                });
              }

              console.log(`PR #${pr.number} is non-compliant: ${issues.join(', ')}`);
            } else if (hasComplianceLabel) {
              // Was non-compliant, now fixed
              await removeLabel('needs:compliance');

              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number
              });
              const marker = '<!-- issue-compliance -->';
              const existing = comments.find(c => c.body.includes(marker));
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id
                });
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: 'PR-ээ шинэчилсэнд баярлалаа. Одоо хувь нэмэр оруулах зааврын шаардлагыг хангаж байна. :+1:'
              });

              console.log(`PR #${pr.number} is now compliant, label removed`);
            } else {
              console.log(`PR #${pr.number} is compliant`);
            }
