name: Build dev macOS preview

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "BUILD DEV MACOS PREVIEW"
        required: true
        type: string

concurrency:
  group: desktop-dev-macos-preview
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MONGOLGPT_CHANNEL: dev
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  build:
    if: github.repository == 'sergei10a-rgb/mongolgpt' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Validate exact preview confirmation
        env:
          PREVIEW_CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$PREVIEW_CONFIRMATION" = "BUILD DEV MACOS PREVIEW"

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Select immutable preview version
        run: echo "MONGOLGPT_VERSION=0.0.0-dev.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Test desktop acceptance checks
        working-directory: packages/desktop
        run: bun test src/main/release-functional-smoke.test.ts src/main/release-smoke.test.ts scripts/mac-preview-config.test.ts

      - name: Prepare desktop bundle
        working-directory: packages/desktop
        run: bun ./scripts/prepare.ts

      - name: Build desktop
        working-directory: packages/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bun run build

      - name: Package ad-hoc signed dev DMG and ZIP
        working-directory: packages/desktop
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never --config electron-builder.mac-preview.config.ts

      - name: Smoke packaged app and DMG installation on native macOS
        working-directory: packages/desktop
        env:
          MONGOLGPT_MAC_ARTIFACT: ${{ runner.temp }}/mongolgpt-macos-evidence
        run: bun ./scripts/smoke-macos.ts

      - name: Prepare checksummed preview artifacts
        working-directory: packages/desktop
        env:
          PREVIEW_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/mongolgpt-macos-preview"
          cp "dist/mongolgpt-desktop-mac-$PREVIEW_ARCH.dmg" "dist/mongolgpt-desktop-mac-$PREVIEW_ARCH.zip" "$RUNNER_TEMP/mongolgpt-macos-preview/"
          cd "$RUNNER_TEMP/mongolgpt-macos-preview"
          shasum -a 256 *.dmg *.zip > SHA256SUMS.txt
          printf '%s\n' "MongolGPT macOS Dev Preview ($PREVIEW_ARCH)" "Version: $MONGOLGPT_VERSION" "Commit: $GITHUB_SHA" "" "Ad-hoc signed, NOT Developer ID signed or notarized. Not a production release." "macOS Gatekeeper may block this development preview." > README.txt

      - name: Upload macOS dev preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mongolgpt-desktop-dev-macos-${{ matrix.arch }}-${{ env.MONGOLGPT_VERSION }}
          path: ${{ runner.temp }}/mongolgpt-macos-preview/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mongolgpt-macos-evidence-${{ matrix.arch }}-${{ github.run_id }}
          path: ${{ runner.temp }}/mongolgpt-macos-evidence/*
          if-no-files-found: warn
          retention-days: 14
