name: Build or publish dev npm preview

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "npm dev tag руу нийтлэх эсэх"
        required: true
        default: false
        type: boolean
      confirmation:
        description: "Build-д BUILD DEV CLI PREVIEW, publish-д PUBLISH DEV CLI SDK PLUGIN UI npm dev гэж яг бичнэ"
        required: true
        type: string

concurrency:
  group: npm-publish-dev-preview
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MONGOLGPT_CHANNEL: dev

jobs:
  build:
    if: github.repository == 'sergei10a-rgb/mongolgpt' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate exact dev preview confirmation
        env:
          PUBLISH_CONFIRMATION: ${{ inputs.confirmation }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: |
          if [ "$PUBLISH_REQUESTED" = "true" ]; then
            expected="PUBLISH DEV CLI SDK PLUGIN UI npm dev"
          else
            expected="BUILD DEV CLI PREVIEW"
          fi
          if [ "$PUBLISH_CONFIRMATION" != "$expected" ]; then
            echo "Dev npm preview баталгаажуулалт буруу байна."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Select immutable preview version
        id: version
        run: echo "version=0.0.0-dev-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Build every CLI platform package
        env:
          MONGOLGPT_VERSION: ${{ steps.version.outputs.version }}
        run: bun run --cwd packages/mongolgpt build

      - name: Dry-run npm packaging
        env:
          MONGOLGPT_VERSION: ${{ steps.version.outputs.version }}
        run: bun packages/mongolgpt/script/publish.ts --dry-run --npm-only

      - name: Install local npm tarballs and smoke CLI
        run: bun packages/mongolgpt/script/smoke-local-npm-install.ts --expected-account-url https://dev.mgpt.mn

      - name: Build and dry-run SDK, plugin, and UI packages
        env:
          MONGOLGPT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          bun packages/sdk/js/script/publish.ts --dry-run
          bun packages/plugin/script/publish.ts --dry-run
          bun packages/ui/script/publish.ts --dry-run

      - name: Verify local CLI package set
        env:
          MONGOLGPT_VERSION: ${{ steps.version.outputs.version }}
        run: bun packages/mongolgpt/script/release-preflight.ts

      - name: Upload CLI packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mongolgpt-dev-cli-${{ steps.version.outputs.version }}
          path: packages/mongolgpt/dist
          if-no-files-found: error
          retention-days: 7

      - name: Archive SDK, plugin, and UI build output
        env:
          MONGOLGPT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          tar -czf "mongolgpt-dev-platform-${MONGOLGPT_VERSION}.tar.gz" \
            packages/sdk/js/dist \
            packages/plugin/dist \
            packages/ui/dist

      - name: Upload SDK, plugin, and UI build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mongolgpt-dev-platform-${{ steps.version.outputs.version }}
          path: mongolgpt-dev-platform-${{ steps.version.outputs.version }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  smoke-windows:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download CLI packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mongolgpt-dev-cli-${{ needs.build.outputs.version }}
          path: packages/mongolgpt/dist

      - name: Smoke Windows CLI and anonymous Free Auto gate
        shell: pwsh
        working-directory: packages/mongolgpt
        run: ./script/smoke-built-cli-windows.ps1 -BinaryPath "dist/mongolgpt-windows-x64/bin/mongolgpt.exe" -ExpectedVersion "${{ needs.build.outputs.version }}" -ExpectedAccountUrl "https://dev.mgpt.mn"

  publish:
    if: inputs.publish == true
    needs:
      - build
      - smoke-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup public npm registry
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Verify npm token and MongolGPT organization membership
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          owner="$(npm whoami --registry=https://registry.npmjs.org)"
          members="$(npm org ls mongolgpt --json --registry=https://registry.npmjs.org)"
          node -e '
            const members = JSON.parse(process.argv[1])
            const owner = process.argv[2]
            if (!members || typeof members !== "object" || !(owner in members)) {
              console.error(`${owner} нь @mongolgpt npm organization-ийн гишүүн биш байна.`)
              process.exit(1)
            }
          ' "$members" "$owner"

      - name: Download verified CLI packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mongolgpt-dev-cli-${{ needs.build.outputs.version }}
          path: packages/mongolgpt/dist

      - name: Download verified SDK, plugin, and UI build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mongolgpt-dev-platform-${{ needs.build.outputs.version }}
          path: .artifacts/platform

      - name: Restore verified SDK, plugin, and UI build output
        env:
          MONGOLGPT_VERSION: ${{ needs.build.outputs.version }}
        run: tar -xzf ".artifacts/platform/mongolgpt-dev-platform-${MONGOLGPT_VERSION}.tar.gz"

      - name: Publish only CLI packages under the dev tag
        env:
          MONGOLGPT_VERSION: ${{ needs.build.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: false
        run: bun packages/mongolgpt/script/publish.ts --npm-only

      - name: Publish SDK, plugin, and UI packages under the dev tag
        env:
          MONGOLGPT_VERSION: ${{ needs.build.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: false
        run: |
          bun packages/sdk/js/script/publish.ts --skip-build
          bun packages/plugin/script/publish.ts --skip-build
          bun packages/ui/script/publish.ts --skip-build

      - name: Reinstall from the public registry and verify all npm packages
        env:
          MONGOLGPT_VERSION: ${{ needs.build.outputs.version }}
        run: bun packages/mongolgpt/script/release-preflight.ts --npm
