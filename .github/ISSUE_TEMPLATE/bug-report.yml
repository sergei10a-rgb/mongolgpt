name: "Алдаа мэдээлэх"
description: "Засах шаардлагатай асуудлыг ойлгомжтой, товч баримттайгаар мэдээлнэ үү"
body:
  - type: textarea
    id: description
    attributes:
      label: "Асуудлын тайлбар"
      description: "Ямар алдаа гарсан, ямар үр дүн хүлээж байснаа тайлбарлана уу"
      placeholder: "Юу болсон бэ?"
    validations:
      required: true

  - type: input
    id: plugins
    attributes:
      label: "Нэмэлтүүд"
      description: "Ямар plugin ашиглаж байна вэ?"
    validations:
      required: false

  - type: input
    id: mongolgpt-version
    attributes:
      label: "MongolGPT хувилбар"
      description: "MongolGPT-ийн ямар хувилбар ашиглаж байна вэ?"
    validations:
      required: false

  - type: textarea
    id: reproduce
    attributes:
      label: "Алдааг давтах алхам"
      description: "Энэ асуудлыг бид хэрхэн дахин гаргаж шалгах вэ?"
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false

  - type: textarea
    id: screenshot-or-link
    attributes:
      label: "Дэлгэцийн зураг эсвэл хуваалцах холбоос"
      description: "`/share` ажиллуулж холбоос аваарай, эсвэл дэлгэцийн зураг хавсаргана уу"
      placeholder: "Холбоосоо оруулах эсвэл зургаа энд чирж тавина уу"
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: "Үйлдлийн систем"
      description: "Ямар үйлдлийн систем ашиглаж байна вэ?"
      placeholder: "Жишээ нь macOS 26.0.1, Ubuntu 22.04, Windows 11"
    validations:
      required: false

  - type: input
    id: terminal
    attributes:
      label: "Терминал"
      description: "Ямар терминал ашиглаж байна вэ?"
      placeholder: "Жишээ нь iTerm2, Ghostty, Alacritty, Windows Terminal"
    validations:
      required: false
